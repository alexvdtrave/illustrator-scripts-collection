name: Node Release CI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build_and_test:
    name: Node Build & Test
    uses: ./.github/workflows/lib-node.yml
    permissions:
      actions: read
      id-token: write
      contents: write
    with:
      node-version: 26
      artifact-name: build
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      contents: write
    needs: [build_and_test]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: build
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.jsx --generate-notes
